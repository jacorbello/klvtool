version: 2

# Regenerate man pages with the real release version and build date before
# bundling, so users see "klvtool 1.2.0" / today's date in the .TH header
# rather than the 1970-01-01 placeholder used for the deterministic CI drift
# check. Committed pages stay at the placeholder date; release bundles get
# fresh stamps.
before:
  hooks:
    - go run ./cmd/gen-manpages -out man/man1 -date {{ .Date | date "2006-01-02" }} -version {{ .Version }}

builds:
  - main: ./cmd/klvtool
    binary: klvtool
    ldflags:
      - -s -w
      - -X github.com/jacorbello/klvtool/internal/version.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE*
      # Ship man pages alongside the binary. Released archives include
      # man/man1/klvtool*.1 which users can copy to their MANPATH.
      - man/man1/*.1

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  use: github-native

release:
  use_existing_draft: true
  github:
    owner: jacorbello
    name: klvtool
